<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keyword Extractor</title>
<style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:30px}main{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}h1{color:#223}textarea,input[type=text]{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}button{margin-top:10px;padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;cursor:pointer}button:hover{background:#1d4ed8}#result{margin-top:20px;padding:15px;background:#eef2ff;border-radius:8px;white-space:pre-wrap}small{color:#666}</style>
</head>
<body>
<main>
<h1>Keyword Extractor</h1>
<p>Extract important keywords from text.</p>
<textarea id="text" rows="6" placeholder="Enter text..."></textarea><br><button onclick="analyze()">Extract Keywords</button>
<div id="result"></div>
</main>
<script>
function analyze(){const stop=new Set(['the','a','an','and','or','but','is','are','was','were','in','on','at','to','of','for','with','this','that','it']);const counts={};document.getElementById('text').value.toLowerCase().match(/[a-z0-9]+/g)?.forEach(w=>{if(w.length>2&&!stop[w])counts[w]=(counts[w]||0)+1});const top=Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,8);document.getElementById('result').textContent=top.length?top.map(([w,c])=>`${w}: ${c}`).join('\n'):'No keywords found.';}
</script>
</body>
</html>
